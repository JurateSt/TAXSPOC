<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://www.taxspoc.com/LogoBrowser.svg" />
    <title>This is the Taxspoc test</title>
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Taxspoc" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      if (import.meta.env.VITE_INCLUDE_GOOGLE_ANALYTICS === 'true') {
        const googleAnalyticsId = import.meta.env.VITE_GOOGLE_ANALYTICS_ID;
        if (googleAnalyticsId) {
          const script = document.createElement('script');
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${googleAnalyticsId}`;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          gtag('js', new Date());

          gtag('config', googleAnalyticsId);
        }
      }
    </script>
  </body>
</html>
